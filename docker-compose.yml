services:
  api:
    image: ${DOCKER_IMAGE:-jibobi3-backend:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - DB_HOST=${DB_HOST}
      - GEMINI_API_KEY=${GEMINI_API_KEY}